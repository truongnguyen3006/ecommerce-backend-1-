# Production overrides; local application.properties stays usable.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.cache.time-to-live=5s
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.health.identity.metadata-url=${KEYCLOAK_METADATA_URI}
eureka.client.service-url.defaultZone=${EUREKA_URL}
# Advertise application-network DNS; a multi-network container may select a data-only IP.
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${spring.application.name}
eureka.client.registry-fetch-interval-seconds=10
eureka.client.eureka-server-connect-timeout-seconds=3
eureka.client.eureka-server-read-timeout-seconds=5
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.producer.properties.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.default.api.timeout.ms=3000
app.health.kafka.enabled=true
app.health.schema-registry.url=${SCHEMA_REGISTRY_URL}/subjects
spring.kafka.streams.properties.application.server=inventory-service:8082
spring.kafka.streams.properties.state.dir=/app/data/kafka-streams
management.endpoint.health.group.readiness.include=readinessState,identity,broker,schemaRegistry,inventory
app.errors.log-stacktraces=false
