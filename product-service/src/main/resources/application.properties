# Service Identity
spring.application.name=product-service
server.port=${PRODUCT_SERVICE_PORT:8083}

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/product-service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Cấu hình Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# === CẤU HÌNH TRACING (MICROMETER & ZIPKIN) ===
# ===============================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SERVER_URL:http://localhost:8085}/realms/${KEYCLOAK_REALM:spring-boot-microservices-realm}}
# ==========================================================
# === SỬA LẠI KAFKA PRODUCER (ĐỂ GỬI EVENT CÓ MAGIC BYTE) ===
# ==========================================================

# Địa chỉ server Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Cấu hình "bộ mã hóa" (Serializer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# 1. THÊM: Cung cấp địa chỉ Schema Registry (BẮT BUỘC)
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# 2. SỬA: Thay thế Serializer JSON thô của Spring...
# spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# ...BẰNG Serializer JSON của Confluent Schema Registry
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer

# 3. BỎ: Dòng này không còn cần thiết.
# Serializer của Confluent sẽ tự động đăng ký schema dựa trên class Java.
# spring.kafka.producer.properties.spring.json.type.mapping=productEvent:com.myexampleproject.productservice.event.ProductCreatedEvent

# Tăng số lượng kết nối tối đa từ 10 (mặc định) lên 50
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# Giảm thời gian chờ kết nối (timeout) từ 30s xuống 10s
# (Thà báo lỗi nhanh còn hơn giữ user chờ)
spring.datasource.hikari.connection-timeout=10000
#logging.level.root=WARN

logging.level.root=${LOG_LEVEL:INFO}

# Cloudinary (server-side image upload)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.product-folder=${CLOUDINARY_PRODUCT_FOLDER:ecommerce/products}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Safe API errors and application health
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
app.seed-products.enabled=${SEED_PRODUCTS_ENABLED:true}
app.seed-products.initial-stock=${PRODUCT_SEED_INITIAL_STOCK:10000}
