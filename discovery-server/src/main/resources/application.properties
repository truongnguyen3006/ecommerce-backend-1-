# Dùng localhost để các service khác có thể tìm thấy khi chạy local
eureka.instance.hostname=localhost
spring.application.name=discovery-server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
server.port=${DISCOVERY_SERVER_PORT:8761}

# Dùng localhost cho địa chỉ defaultZone
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Cau hinh bao mat
eureka.username = ${EUREKA_USERNAME:eureka}
eureka.password = ${EUREKA_PASSWORD:password}

logging.level.root=${LOG_LEVEL:INFO}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SERVER_URL:http://localhost:8085}/realms/${KEYCLOAK_REALM:spring-boot-microservices-realm}}
# Safe API errors and application health
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
