# Production overrides; local application.properties stays usable.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.cache.time-to-live=5s
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.health.identity.metadata-url=${KEYCLOAK_METADATA_URI}
eureka.instance.hostname=discovery-server
eureka.username=${EUREKA_USERNAME}
eureka.password=${EUREKA_PASSWORD}
eureka.client.service-url.defaultZone=${EUREKA_URL}
management.endpoint.health.group.readiness.include=readinessState
app.errors.log-stacktraces=false
