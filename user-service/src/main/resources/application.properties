spring.application.name=user-service
server.port=${USER_SERVICE_PORT:8088}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user-service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
#cho phép Hibernate tự cập nhật bảng dữ liệu.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@localhost:8761/eureka/}

# ==============================
# 🔒 Resource Server (JWT validation)
# ==============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SERVER_URL:http://localhost:8085}/realms/${KEYCLOAK_REALM:spring-boot-microservices-realm}}

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8085}
keycloak.realm=${KEYCLOAK_REALM:spring-boot-microservices-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:spring-cloud-client}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:local-demo-client-secret}

logging.level.org.springframework.web=INFO

logging.level.root=${LOG_LEVEL:INFO}

# Safe API errors and application health
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
management.endpoints.web.exposure.include=health,info,prometheus
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
app.seed-admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:admin123456@}
