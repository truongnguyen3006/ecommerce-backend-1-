# Production overrides; local application.properties stays usable.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.cache.time-to-live=5s
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.health.identity.metadata-url=${KEYCLOAK_METADATA_URI}
eureka.client.service-url.defaultZone=${EUREKA_URL}
# Advertise application-network DNS; a multi-network container may select a data-only IP.
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${spring.application.name}
eureka.client.registry-fetch-interval-seconds=10
eureka.client.eureka-server-connect-timeout-seconds=3
eureka.client.eureka-server-read-timeout-seconds=5
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
management.endpoint.health.group.readiness.include=readinessState,identity,db
app.seed-admin.enabled=false
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
app.errors.log-stacktraces=false
