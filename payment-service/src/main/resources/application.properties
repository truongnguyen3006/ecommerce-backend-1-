# Service Identity
spring.application.name=payment-service
server.port=8089

# Eureka Discovery
eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka/

# Database (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/payment-service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=10000

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/spring-boot-microservices-realm

# Kafka / JSON Schema Registry
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
spring.kafka.producer.properties.auto.register.schemas=true

# VNPay Sandbox (optional for startup and the existing mock/COD flow)
vnpay.tmn.code=${VNPAY_TMN_CODE:}
vnpay.secret.key=${VNPAY_SECRET_KEY:}
vnpay.api.url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return.url=${VNPAY_RETURN_URL:http://localhost:8000/api/payment/vnpay/return}
vnpay.ipn.url=${VNPAY_IPN_URL:http://localhost:8000/api/payment/vnpay/ipn}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3001}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8086}

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=always
logging.level.root=ERROR
