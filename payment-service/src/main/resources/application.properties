# Service Identity
spring.application.name=payment-service
server.port=${PAYMENT_SERVICE_PORT:8089}

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:password}@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment-service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=10000

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${KEYCLOAK_SERVER_URL:http://localhost:8085}/realms/${KEYCLOAK_REALM:spring-boot-microservices-realm}}

# Kafka / JSON Schema Registry
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
spring.kafka.producer.properties.auto.register.schemas=true

# VNPay Sandbox (optional for startup and the existing mock/COD flow)
vnpay.tmn.code=${VNPAY_TMN_CODE:}
vnpay.secret.key=${VNPAY_SECRET_KEY:}
vnpay.api.url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return.url=${VNPAY_RETURN_URL:http://localhost:8000/api/payment/vnpay/return}
vnpay.ipn.url=${VNPAY_IPN_URL:http://localhost:8000/api/payment/vnpay/ipn}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3001}
order.service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8086}

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.health.show-details=when_authorized
logging.level.root=${LOG_LEVEL:INFO}

# Safe API errors and application health
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3000}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
