      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  payment-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/payment-service:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      DB_URL: jdbc:mysql://mysql:3306/payment-service?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?required PAYMENT_DB_PASSWORD}
      DB_MIGRATION_USERNAME: payment_migrate
      DB_MIGRATION_PASSWORD: ${PAYMENT_DB_MIGRATION_PASSWORD:?required PAYMENT_DB_MIGRATION_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ORDER_SERVICE_URL: http://order-service:8086
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      VNPAY_API_URL: ${VNPAY_API_URL:?required VNPAY_API_URL}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:?required VNPAY_RETURN_URL}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:?required VNPAY_IPN_URL}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Ho_Chi_Minh
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
    - application
    - data
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  user-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/user-service:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      DB_URL: jdbc:mysql://mysql:3306/user-service?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD:?required USER_DB_PASSWORD}
      DB_MIGRATION_USERNAME: user_migrate
      DB_MIGRATION_PASSWORD: ${USER_DB_MIGRATION_PASSWORD:?required USER_DB_MIGRATION_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?required KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?required KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?required KEYCLOAK_CLIENT_SECRET}
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
    - application
    - data
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  notification-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/notification-service:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ORDER_SERVICE_URL: http://order-service:8086
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
    - application
    - data
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  frontend:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/frontend:${IMAGE_TAG:?required}
    build:
      context: ${FRONTEND_SOURCE:-../frontend}
      dockerfile: Dockerfile
      args:
        API_URL: http://api-gateway:8080
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?required NEXT_PUBLIC_WS_URL}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
    - application
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  prometheus:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --storage.tsdb.retention.size=10GB
    volumes:
    - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus-data:/prometheus
    networks:
    - application
    - monitoring
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9090/-/ready
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  grafana:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USERNAME:?required GRAFANA_ADMIN_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana-data:/var/lib/grafana
    - ./deploy/observability/datasources.yml:/etc/grafana/provisioning/datasources/project1.yml:ro
    - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
    - monitoring
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/api/health
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  zipkin:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: openzipkin/zipkin:3.5.1@sha256:bb570eb45c2994eaf32da783cc098b3d51d1095b73ec92919863d73d0a9eaafb
    environment:
      STORAGE_TYPE: mem
      JAVA_OPTS: -Xms128m -Xmx512m
    networks:
    - application
    - monitoring
    healthcheck:
      test:
      - CMD
      - docker-healthcheck
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  reverse-proxy:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/reverse-proxy:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    environment:
      PUBLIC_APP_HOST: ${PUBLIC_APP_HOST:?required PUBLIC_APP_HOST}
      PUBLIC_AUTH_HOST: ${PUBLIC_AUTH_HOST:?required PUBLIC_AUTH_HOST}
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
    - edge
    - application
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
networks:
  edge:
    driver: bridge
  application:
    driver: bridge
  data:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true
volumes:
  business-db: {}
  keycloak-db: {}
  redis-data: {}
  kafka-data: {}
  inventory-streams: {}
  prometheus-data: {}
  grafana-data: {}
