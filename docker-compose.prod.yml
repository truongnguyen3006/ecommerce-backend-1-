name: ${COMPOSE_PROJECT_NAME:-project1-prod}
services:
  mysql:
    restart: unless-stopped
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    stop_grace_period: 45s
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required MYSQL_ROOT_PASSWORD}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?required PRODUCT_DB_PASSWORD}
      PRODUCT_DB_MIGRATION_PASSWORD: ${PRODUCT_DB_MIGRATION_PASSWORD:?required PRODUCT_DB_MIGRATION_PASSWORD}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?required ORDER_DB_PASSWORD}
      ORDER_DB_MIGRATION_PASSWORD: ${ORDER_DB_MIGRATION_PASSWORD:?required ORDER_DB_MIGRATION_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?required PAYMENT_DB_PASSWORD}
      PAYMENT_DB_MIGRATION_PASSWORD: ${PAYMENT_DB_MIGRATION_PASSWORD:?required PAYMENT_DB_MIGRATION_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?required USER_DB_PASSWORD}
      USER_DB_MIGRATION_PASSWORD: ${USER_DB_MIGRATION_PASSWORD:?required USER_DB_MIGRATION_PASSWORD}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?required CART_DB_PASSWORD}
      CART_DB_MIGRATION_PASSWORD: ${CART_DB_MIGRATION_PASSWORD:?required CART_DB_MIGRATION_PASSWORD}
    volumes:
    - business-db:/var/lib/mysql
    - ./deploy/mysql/01-service-schemas.sh:/docker-entrypoint-initdb.d/01-service-schemas.sh:ro
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=socket -uroot -Nse "SELECT 1" >/dev/null
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
  keycloak-db:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: mysql:8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:?required KEYCLOAK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required KEYCLOAK_DB_PASSWORD}
    volumes:
    - keycloak-db:/var/lib/mysql
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=socket -uroot -Nse "SELECT 1" >/dev/null
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
  keycloak:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/keycloak:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    command:
    - start
    - --optimized
    - --import-realm
    environment:
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?required KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8080'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?required KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?required KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?required KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?required KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?required KEYCLOAK_CLIENT_SECRET}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
    volumes:
    - ./deploy/keycloak/runtime:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
    - data
    - application
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q "200"'
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
  redis:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required REDIS_PASSWORD}
    entrypoint:
    - /bin/sh
    - /start-production.sh
    volumes:
    - redis-data:/data
    - ./deploy/redis/start.sh:/start-production.sh:ro
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
  kafka:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: confluentinc/cp-kafka:7.6.10@sha256:7cce3895882347426e3e215b79e803fffdf94b53ec4e430529028e70cfb5cbfc
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?required KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_MIN_INSYNC_REPLICAS: '1'
      KAFKA_LOG_RETENTION_HOURS: '168'
      KAFKA_LOG_RETENTION_BYTES: '-1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '3000'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
    - kafka-data:/var/lib/kafka/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server kafka:29092 --list >/dev/null
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
  schema-registry:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: confluentinc/cp-schema-registry:7.6.10@sha256:13598a7c55949e3226ff4b2b85243a09b7b254541f88c6e5683463400b1a94ea
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8081/subjects >/dev/null
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
  discovery-server:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/discovery-server:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
    - application
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  api-gateway:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/api-gateway:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      DISCOVERY_BASE_URL: http://discovery-server:8761
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
    - application
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  product-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/product-service:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: product-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USERNAME: ${EUREKA_USERNAME:?required EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:?required EUREKA_PASSWORD}
      EUREKA_URL: http://${EUREKA_USERNAME:?required}:${EUREKA_PASSWORD:?required}@discovery-server:8761/eureka/
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      DB_URL: jdbc:mysql://mysql:3306/product-service?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
      DB_USERNAME: product_app
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?required PRODUCT_DB_PASSWORD}
      DB_MIGRATION_USERNAME: product_migrate
      DB_MIGRATION_PASSWORD: ${PRODUCT_DB_MIGRATION_PASSWORD:?required PRODUCT_DB_MIGRATION_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      keycloak:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
    - application
    - data
    deploy:
      replicas: 1
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
  inventory-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/inventory-service:${IMAGE_TAG:?required}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
