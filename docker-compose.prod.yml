      - curl -fsS --max-time 10 http://127.0.0.1:9091/actuator/health/readiness >/dev/null
      interval: 20s
      timeout: 12s
      retries: 10
      start_period: 150s
    volumes:
    - inventory-streams:/app/data/kafka-streams
  cart-service:
    restart: unless-stopped
    logging: *id001
    stop_grace_period: 45s
    image: ${IMAGE_NAMESPACE:?required}/cart-service:${IMAGE_TAG:?required}
