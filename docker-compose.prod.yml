      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?required KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/protocol/openid-connect/certs
      KEYCLOAK_METADATA_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:?required}/.well-known/openid-configuration
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:?required PUBLIC_FRONTEND_URL}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-0.1}
      DB_URL: jdbc:mysql://mysql:3306/order-service?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC
      DB_USERNAME: order_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?required ORDER_DB_PASSWORD}
      DB_MIGRATION_USERNAME: order_migrate
      DB_MIGRATION_PASSWORD: ${ORDER_DB_MIGRATION_PASSWORD:?required ORDER_DB_MIGRATION_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    depends_on:
