name: Backend CI
on:
  push:
    branches: [production-ready-final, project1-recovery, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '24.0.2'
          cache: maven
      - name: Verify all modules and self-contained tests
        run: mvn -B -ntp clean verify
      - name: Check deployment scripts
        run: |
          for script in scripts/*.sh deploy/mysql/*.sh deploy/redis/*.sh deploy/nginx/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py
      - name: Validate production Compose model
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
