name: Backend CI
on:
  push:
    branches: [production-ready-final, project1-recovery, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '24.0.2'
          cache: maven
      - name: Install Redis for isolated atomic-cart tests
        run: sudo apt-get update && sudo apt-get install --yes redis-server
      - name: Verify all modules and self-contained tests
        run: mvn -B -ntp clean verify
      - name: Check deployment scripts
        run: |
          for script in scripts/*.sh deploy/mysql/*.sh deploy/redis/*.sh deploy/nginx/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py .github/scripts/*.py
      - name: Validate production Compose model
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
  images:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build every production application image without publishing
        shell: bash
        run: |
          for service in api-gateway discovery-server product-service inventory-service cart-service order-service payment-service user-service notification-service; do
            docker build --file Dockerfile --build-arg "SERVICE=$service" --tag "project1-validation/$service:$GITHUB_SHA" .
            test "$(docker image inspect --format '{{.Config.User}}' "project1-validation/$service:$GITHUB_SHA")" = '10001:10001'
          done
      - name: Build optimized Keycloak and ingress images without publishing
        run: |
          docker build --file deploy/keycloak/Dockerfile --tag "project1-validation/keycloak:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "project1-validation/keycloak:$GITHUB_SHA")" = '1000'
          docker build --file deploy/nginx/Dockerfile --tag "project1-validation/reverse-proxy:$GITHUB_SHA" .
          test "$(docker image inspect --format '{{.Config.User}}' "project1-validation/reverse-proxy:$GITHUB_SHA")" = 'nginx'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: truongnguyen3006/ecommerce-frontend-1-
          ref: 5b3be4d6dfb0a588df11d3c5160479b7a1496fdd
          path: frontend-ci
          persist-credentials: false
      - name: Build the paired frontend for disposable stack validation
        run: docker build --file frontend-ci/Dockerfile --build-arg API_URL=http://api-gateway:8080 --build-arg NEXT_PUBLIC_WS_URL=https://ci-app.example.com/ws --tag "project1-validation/frontend:$GITHUB_SHA" frontend-ci
      - name: Start the complete disposable production stack and run read-only smoke
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ github.workspace }}/.env.production.ci
        run: |
          umask 077
          python3 .github/scripts/prepare-smoke.py
          python3 scripts/prepare-keycloak.py "$PRODUCTION_ENV_FILE"
          scripts/compose-prod.sh -f .github/runtime/smoke-override.json config --quiet
          scripts/compose-prod.sh -f .github/runtime/smoke-override.json up --no-build --pull missing --detach --wait --wait-timeout 600
          scripts/smoke-production.sh
          scripts/compose-prod.sh stop api-gateway product-service inventory-service cart-service order-service payment-service user-service notification-service discovery-server keycloak
          scripts/backup-mysql.sh mysql "$RUNNER_TEMP/project1-ci-business.sql"
          scripts/backup-mysql.sh keycloak-db "$RUNNER_TEMP/project1-ci-keycloak.sql"
      - name: Show status and stop only the disposable CI project
        if: always()
        env:
          PRODUCTION_ENV_FILE: ${{ github.workspace }}/.env.production.ci
        run: |
          if [ -f "$PRODUCTION_ENV_FILE" ]; then
            scripts/compose-prod.sh ps --all
            if [ "${{ job.status }}" != success ]; then
              scripts/compose-prod.sh logs --no-color --tail 120 api-gateway zipkin reverse-proxy 2>&1 | python3 -c 'import re,sys; print(re.sub(r"[a-fA-F0-9]{64}", "[redacted]", sys.stdin.read()))'
            fi
            scripts/compose-prod.sh down --timeout 30
          fi
