global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9091
          - discovery-server:9091
          - product-service:9091
          - inventory-service:9091
          - cart-service:9091
          - order-service:9091
          - payment-service:9091
          - user-service:9091
          - notification-service:9091
